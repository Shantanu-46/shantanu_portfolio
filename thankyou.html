<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Shantanu Gaikwad</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #f3f3f1;
            color: #111;
            font-family: "Inter", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .thank-you {
            width: 100%;
            max-width: 760px;
            text-align: center;
        }

        .number {
            font-size: 13px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 28px;
        }

        .check {
            width: 64px;
            height: 64px;
            border: 1px solid #111;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 34px;
            font-size: 25px;
        }

        h1 {
            font-family: "Playfair Display", serif;
            font-size: clamp(48px, 8vw, 82px);
            font-weight: 500;
            line-height: 0.95;
            letter-spacing: -0.04em;
            margin-bottom: 28px;
        }

        .message {
            max-width: 520px;
            margin: 0 auto;
            color: #666;
            font-size: 17px;
            line-height: 1.7;
        }

        .name {
            margin-top: 38px;
            font-size: 15px;
            font-weight: 600;
        }

        .role {
            margin-top: 7px;
            color: #777;
            font-size: 13px;
        }

        .back {
            display: inline-block;
            margin-top: 45px;
            padding: 13px 22px;
            border: 1px solid #111;
            color: #111;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: 0.25s ease;
        }

        .back:hover {
            background: #111;
            color: #fff;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }

            h1 {
                font-size: 54px;
            }

            .message {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="thank-you">

        <div class="number">Enquiry received</div>

        <div class="check">✓</div>

        <h1>Thank you.</h1>

        <p class="message">
            Your message has been received successfully.
            I'll review your enquiry and get back to you soon.
        </p>

        <div class="name">
            Shantanu Gaikwad
        </div>

        <div class="role">
            Data Analytics & Machine Learning
        </div>

        <a href="index.html" class="back">
            ← Back to Portfolio
        </a>

    </main>

</body>
</html>
